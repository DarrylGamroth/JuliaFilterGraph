# Synthetic asymmetric pupil with excluded pixels. Samples are column-major.
# The mean divisor is the sum over the support divided by its size.
# For each supported pixel the result is pixel / divisor - reference.

[geometry]
image_size = [3, 3]
support = [true, true, false, false, true, true, true, false, true]

[frame]
image = [1, 3, 11, 2, 4, 6, 13, 15, 21]

[calibration]
signature = 121
reference_pupil_image = [0.03125, -0.125, 0.0, 0.0, 0.25, -0.125, 0.0625, 0.0, 0.125]

[mean_valid_flux]
normalization_divisor = 8.0
signal = [0.09375, 0.5, 0.25, 0.875, 1.5625, 2.5]

[incidence_flux]
normalization_divisor = 16.0
signal = [0.03125, 0.3125, 0.0, 0.5, 0.75, 1.1875]
