# captured by executing that revision with the cases below.

[[cases]]
name = "inside"
max_command_power = 25.0
requested = [1.0, 2.0]
expected = [1.0, 2.0]
expected_bits = [1065353216, 1073741824]

[[cases]]
name = "boundary"
max_command_power = 25.0
requested = [3.0, 4.0]
expected = [3.0, 4.0]
