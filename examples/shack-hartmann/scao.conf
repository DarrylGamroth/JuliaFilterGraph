{
    # Structurally representative single-conjugate AO RTC for a 352 by 352
    # Shack-Hartmann detector. The 188 regular-grid subapertures are example
    # construction values. Qualified origins, coordinate maps, references,
    # thresholds, active flags, and reconstructor remain parameter Ports.
    # Scientific payload IDs below come from the shared typed schema catalog;
    # they do not name this package or Graph.
    # PipeWire name of the Julia island Node that hosts this Filter Graph.
    node.name = example-shack-hartmann-scao

    # PipeWire filter-graph object. Each entry in `nodes` instantiates an
    # Algorithm. `type = ndarray` selects typed multidimensional-array Ports;
    # `name` is the Graph-local Node name; `label` selects the Algorithm; and
    # `config` contains preparation-time configuration. `props` contains
    # runtime-replaceable scalar Properties.
    filter.graph = {
        # Algorithm instances. The prepared Graph derives its same-sample
        # schedule from the dependency edges in `links`.
        nodes = [
            {
                # Convert the raw UInt16 detector frame to calibrated Float32.
                type = ndarray
                name = calibrate
                label = pixel-calibration-u16-f32
                config = {
                    # Full detector-frame height and width, in pixels.
                    image_size = [352, 352]
                    # Optional row-major initial calibration planes. `null`
                    # prepares identity flat and zero background planes; the
                    # qualified planes arrive through Parameter Ports below.
                    initial_flat = null
                    initial_background = null
                }
            }
            {
                # Measure one x/y slope pair for each Shack-Hartmann lenslet.
                type = ndarray
                name = measure
                label = shack-hartmann-image-f32
                config = {
                    # Shape of the calibrated detector frame consumed here.
                    image_size = [352, 352]
                    image_schema = pipewireao/calibrated-pixels-f32/1
                    # Height and width, in pixels, of each subaperture window.
                    subaperture_size = [22, 22]
                    # Number of lenslet windows to measure.
                    subaperture_count = 188
                    # Optional zero-based (row, column) origins for all
                    # subapertures. `null` prepares a regular grid; deployment
                    # supplies qualified origins through the Parameter Port.
                    initial_subaperture_origins = null
                    # Scale from centroid pixel displacement to slope units.
                    coordinate_scale = 0.697
                    # Default per-pixel floor applied before centroiding.
                    pixel_threshold = 0.0
                    # Default minimum summed subaperture flux for validity.
                    flux_threshold = 1.0
                    # Optional initial x/y reference slopes, shape 188 by 2.
                    # `null` prepares zeros until the Parameter Port replaces it.
                    reference_slopes = null
                    # Optional initial active-lenslet mask, length 188. `null`
                    # makes every subaperture active.
                    active = null
                }
            }
            {
                # Multiply the measured x/y slopes by the SHWFS reconstructor.
                type = ndarray
                name = reconstruct
                label = shwfs-reconstructor-f32
                config = {
                    # Number of reconstructed controller coordinates.
                    reconstructed_count = 221
                    # Must equal the measurement Node's subaperture count.
                    subaperture_count = 188
                    # Optional row-major 221 by 376 reconstructor. `null`
                    # prepares zeros until the Parameter Port supplies it.
                    initial_reconstructor = null
                    # Schema assigned to the reconstructed output Port. This
                    # compatibility identifier fixes its scientific meaning.
                    reconstructed_schema = pipewireao/controller-residual-error-f32/1
                }
            }
            {
                # Apply the stateful leaky-integrator control law.
                type = ndarray
                name = law
                label = leaky-integrator-f32
                config = {
                    # Length of input, output, and committed state vectors.
                    extent = 221
                    # Reset value for every committed controller coordinate.
                    initial_state = 0.0
                    # Schemas must agree with the linked upstream and
                    # downstream Ports.
                    input_schema = pipewireao/controller-residual-error-f32/1
                    output_schema = pipewireao/controller-command-f32/1
                }
                props = {
                    # Current residual-error multiplier. Reconstruction is
                    # upstream, so the correction convention uses a negative gain.
                    gain = -0.4
                    # Previous committed-command multiplier; one is a pure
                    # integrator and values below one introduce leakage.
                    pole = 1.0
                }
            }
            {
                # Project controller coordinates into the active VDM basis.
                type = ndarray
                name = controller-to-vdm
                label = controller-to-vdm-f32
                config = {
                    # Input controller-coordinate count.
                    controller_command_count = 221
                    # Output active virtual-DM-coordinate count.
                    active_vdm_count = 221
                }
            }
            {
                # Extrapolate the active VDM and project it onto the PDM.
                type = ndarray
                name = vdm-to-pdm
                label = vdm-to-pdm-f32
                config = {
                    # The active-to-full map owns extrapolation from the 221
                    # controlled coordinates to an illustrative 17 by 17 full
                    # VDM grid. The next map projects that grid to the 277 PDM
                    # actuators.
                    # Controlled input coordinates.
                    active_vdm_count = 221
                    # Full virtual grid coordinates, here 17 by 17.
                    full_vdm_count = 289
                    # Physical deformable-mirror actuator count.
                    physical_actuator_count = 277
                }
            }
            {
                # Enforce physical command limits and report their correction.
                type = ndarray
                name = command
                label = pdm-command-f32
                config = {
                    # Must equal the requested and demanded PDM vector length.
                    actuator_count = 277
                    # Illustrative normalized actuator bounds. Each may also
                    # be a length-277 vector for per-actuator limits.
                    command_limits = [-1.0, 1.0]
                    # Maximum absolute per-sample actuator change. A scalar
                    # applies to every actuator; a vector sets per-actuator
                    # limits; `null` disables slew limiting.
                    slew_limit = null
                    # Optional initial command vector used as the committed
                    # slew state after preparation and reset. `null` uses zero.
                    initial_current = null
                }
            }
            {
                # Project PDM constraint feedback back through the virtual DM.
                type = ndarray
                name = pdm-feedback-to-vdm
                label = pdm-feedback-to-vdm-f32
                config = {
                    # These dimensions mirror the forward VDM-to-PDM Node.
                    active_vdm_count = 221
                    full_vdm_count = 289
                    physical_actuator_count = 277
                }
            }
            {
                # Return active-VDM constraint feedback to controller space.
                type = ndarray
                name = vdm-feedback-to-controller
                label = vdm-feedback-to-controller-f32
                config = {
                    # Output controller count and input active-VDM count.
                    controller_command_count = 221
                    active_vdm_count = 221
                }
            }
        ]
        # Internal typed Port connections. `output` and `input` use the
        # `node-name:port-name` form; linked types, shapes, and schemas must
        # agree. Values flow from calibration through command conditioning,
        # then constraint feedback flows back through explicit projection
        # Nodes without forming a same-sample cycle.
        links = [
            # Calibrated detector image into Shack-Hartmann measurement.
            { output = "calibrate:calibrated" input = "measure:image" }
            # Measured x/y slopes into dense reconstruction.
            { output = "measure:slopes" input = "reconstruct:slopes" }
            # Reconstructed residual error into the control law.
            { output = "reconstruct:reconstructed" input = "law:input" }
            {
                # Controller command into the active VDM projection.
                output = "law:output"
                input = "controller-to-vdm:controller-command"
            }
            {
                # Active VDM command into extrapolation and PDM projection.
                output = "controller-to-vdm:vdm-command"
                input = "vdm-to-pdm:vdm-command"
            }
            {
                # Requested physical command into limit conditioning.
                output = "vdm-to-pdm:requested-pdm-command"
                input = "command:requested"
            }
            {
                # PDM correction into the reverse physical projection.
                output = "command:constraint-feedback"
                input = "pdm-feedback-to-vdm:pdm-constraint-feedback"
            }
            {
                # Active VDM correction into the controller projection.
                output = "pdm-feedback-to-vdm:vdm-constraint-feedback"
                input = "vdm-feedback-to-controller:vdm-constraint-feedback"
            }
        ]
        # External input and Parameter Ports exposed by the Julia island.
        # Parameter Ports carry prepared calibration/projection arrays and may
        # be replaced without putting large arrays in this configuration.
        inputs = [
            # Per-sample UInt16 detector frame, shape 352 by 352.
            "calibrate:raw"
            # Float32 flat and background calibration planes, each 352 by 352.
            "calibrate:flat"
            "calibrate:background"
            # Zero-based (row, column) origins, shape 188 by 2.
            "measure:subaperture-origins"
            # Per-window x/y coordinate map, shape 484 by 2.
            "measure:coordinates"
            # Reference x/y slopes, shape 188 by 2.
            "measure:reference-slopes"
            # Pixel and flux thresholds for each subaperture, shape 188 by 2.
            "measure:thresholds"
            # Active-subaperture mask, length 188.
            "measure:active"
            # Dense SHWFS reconstructor, shape 221 by 376.
            "reconstruct:reconstructor"
            # Controller-to-active-VDM projection, shape 221 by 221.
            "controller-to-vdm:controller-to-vdm"
            # Active-to-full VDM extrapolation, shape 289 by 221.
            "vdm-to-pdm:active-to-full"
            # Full-VDM-to-PDM projection, shape 277 by 289.
            "vdm-to-pdm:vdm-to-pdm"
            # Full-to-active VDM feedback projection, shape 221 by 289.
            "pdm-feedback-to-vdm:full-to-active"
            # PDM-to-full-VDM feedback projection, shape 289 by 277.
            "pdm-feedback-to-vdm:pdm-to-vdm"
            # Active-VDM-to-controller projection, shape 221 by 221.
            "vdm-feedback-to-controller:vdm-to-controller"
        ]
        # External outputs publish only after successful Graph completion;
        # Node state uses each Algorithm's local commit/discard contract.
        outputs = [
            # Conditioned physical command sent toward the DM adapter.
            "command:demanded"
            # Command correction returned in controller coordinates.
            # The external owner receives it; this leaky-integrator Node
            # does not adopt constraint feedback in its recurrence.
            "vdm-feedback-to-controller:controller-constraint-feedback"
            # Measured flux for every subaperture, length 188.
            "measure:flux"
            # Per-subaperture validity after active/threshold checks.
            "measure:validity"
        ]
    }
}
