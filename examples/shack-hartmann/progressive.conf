{
    # Progressive Shack-Hartmann measurement and dense reconstruction. The
    # host supplies one calibrated Float32 detector row at a time. Slopes are
    # measured and their MVM columns are accumulated as soon as each lenslet
    # window becomes complete; only the terminal reconstructed vector is
    # exposed outside the Graph.
    node.name = example-shack-hartmann-progressive-reconstruction

    filter.graph = {
        # Deployment scheduling for prepare_cpu_progressive_graph. Zero keeps
        # the no-extra-thread path. A deployment with reserved Julia threads
        # may set row_workers = 4 and worker_thread_ids = [3 4 5 6].
        execution = { cpu = { row_workers = 0 } }
        nodes = [
            {
                # Convert detector rows into newly immutable slope blocks.
                type = ndarray
                name = measure
                label = shack-hartmann-measurement-block-f32
                config = {
                    # Full detector height and width in pixels.
                    image_size = [352, 352]
                    # Rows supplied in each callback; one gives 352 blocks per
                    # detector sample.
                    row_block_rows = 1
                    # Height and width of each lenslet window.
                    subaperture_size = [22, 22]
                    # Number of measured lenslets.
                    subaperture_count = 188
                    # `null` prepares a regular zero-based lenslet grid. A
                    # deployment normally replaces it through the Parameter
                    # Port after registration.
                    initial_subaperture_origins = null
                    # Centroid-displacement to slope-unit conversion.
                    coordinate_scale = 0.697
                    # Default pixel floor and minimum valid lenslet flux.
                    pixel_threshold = 0.0
                    flux_threshold = 1.0
                    # `null` prepares zero reference slopes and enables every
                    # lenslet; both remain replaceable Parameter Ports.
                    reference_slopes = null
                    active = null
                    # These three graph-local schemas define the aligned block
                    # contract. A deployment may use its own versioned names,
                    # but producer and consumer values must match exactly.
                    measurements_schema = org.example.ao.shwfs-measurement-block/1
                    column_indices_schema = org.example.ao.reconstructor-column-indices/1
                    measurement_count_schema = org.example.ao.measurement-block-count/1
                }
            }
            {
                # Accumulate only the reconstructor columns named by each
                # measurement block.
                type = ndarray
                name = reconstruct
                label = incremental-dense-reconstructor-f32
                config = {
                    # Two slopes for each of 188 lenslets.
                    measurement_count = 376
                    # Fixed buffer capacity; count selects the valid prefix.
                    measurement_block_capacity = 376
                    # Must equal image_size[1] / row_block_rows above.
                    blocks_per_sample = 352
                    # Number of reconstructed controller coordinates.
                    reconstructed_count = 221
                    # `null` prepares zeros until the qualified reconstructor
                    # arrives through the Parameter Port.
                    initial_reconstructor = null
                    # Must match the three producer schemas exactly.
                    measurements_schema = org.example.ao.shwfs-measurement-block/1
                    column_indices_schema = org.example.ao.reconstructor-column-indices/1
                    measurement_count_schema = org.example.ao.measurement-block-count/1
                    # Established FGN compatibility schemas for the prepared
                    # reconstructor and the resulting residual error.
                    reconstructed_schema = pipewireao/controller-residual-error-f32/1
                    reconstructor_schema = pipewireao/shwfs-reconstructor-f32/1
                }
            }
        ]
        links = [
            { output = "measure:measurements" input = "reconstruct:measurements" }
            { output = "measure:columns" input = "reconstruct:columns" }
            { output = "measure:count" input = "reconstruct:count" }
        ]
        inputs = [
            # Calibrated Float32 row block, shape 1 by 352.
            "measure:row-block"
            # Qualified measurement and reconstruction Parameters.
            "measure:subaperture-origins"
            "measure:coordinates"
            "measure:reference-slopes"
            "measure:thresholds"
            "measure:active"
            "reconstruct:reconstructor"
        ]
        outputs = [
            # Published once after all 376 columns and every downstream Node
            # have completed successfully.
            "reconstruct:reconstructed"
        ]
    }
}
