version = 1
frame_encoding = "float32"
definition = "Complete detector-plane F32 ADU values in detector (row, column) axis order."

[[schemas]]
constant = "DETECTOR_EM_OUTPUT_ELECTRONS_V1"
name = "detector-em-output-electrons"
element_type = "Float32"
version = 1
frame_encoding = "float32"
definition = "Complete detector-plane F32 samples in electron-multiplication-register output-electron units, in detector (row, column) axis order. The declared acquisition includes electron multiplication and output-referred readout noise; the electron-multiplication gain has not been divided out. Signed read-noise excursions are retained unless the acquisition explicitly declares clipping. This quantity does not imply ADC conversion, quantization, or gain normalization."

[[schemas]]
constant = "DETECTOR_INPUT_EQUIVALENT_ELECTRONS_V1"
name = "detector-input-equivalent-electrons"
element_type = "Float32"
version = 1
frame_encoding = "float32"
definition = "Complete detector-plane F32 samples in input-equivalent electrons, in detector (row, column) axis order. Each electron-multiplication-register output-electron sample, including output-referred readout noise, is divided by the declared positive electron-multiplication gain. Signed read-noise excursions are retained unless the producer explicitly declares clipping. Gain normalization preserves multiplication noise and does not imply ADC conversion or quantization."

[[schemas]]
constant = "ATMOSPHERE_OPD_M_V1"
name = "atmosphere-opd-m"
element_type = "Float32"
version = 1
definition = "F32 atmosphere optical path difference in metres on the sampled pupil grid."

[[schemas]]
constant = "ACTUATOR_COMMAND_OPD_M_V1"
name = "actuator-command-opd-m"
element_type = "Float32"
version = 1
definition = "F32 actuator commands in metres of wavefront optical path difference, in physical-actuator order."

[[schemas]]
constant = "TIP_TILT_OPD_COEFFICIENTS_M_V1"
name = "tip-tilt-opd-coefficients-m"
element_type = "Float32"
version = 1
definition = "Two F32 coefficients in metres of wavefront optical path difference, ordered (X ramp, Y ramp), for the dimensionless normalized-pupil-xy basis. On the supported pupil, the additive OPD is coefficient[1]*X + coefficient[2]*Y. A positive coefficient adds OPD increasing with its corresponding pupil coordinate. These are normalized-pupil ramp amplitudes, not angular pointing values or mirror displacements."

[[schemas]]
constant = "DM_SURFACE_OPD_M_V1"
name = "dm-surface-opd-m"
element_type = "Float32"
version = 1
definition = "F32 deformable-mirror wavefront optical path difference in metres on the sampled pupil grid."

[[schemas]]
constant = "ACTUATOR_GRID_INDICES_V1"
name = "actuator-grid-indices"
element_type = "Int32"
version = 1
definition = "One-based I32 indices into the column-major square actuator grid, in physical-actuator order. Indices are unique and address the declared grid."

[[schemas]]
constant = "NORMALIZED_PUPIL_ACTUATOR_COORDINATES_V1"
name = "normalized-pupil-actuator-coordinates"
element_type = "Float32"
version = 1
definition = "F32 normalized pupil X/Y actuator coordinates in (coordinate, actuator) axis order."

[[schemas]]
constant = "NORMALIZED_PUPIL_XY_V1"
name = "normalized-pupil-xy"
element_type = "Float32"
version = 1
definition = "F32 dimensionless Cartesian pupil ramps in (pupil_x, pupil_y, component) axis order with two components: component 1 is X and component 2 is Y. For one-based indices i and j on an Nx-by-Ny raster, X=(i-(Nx+1)/2)/(Nx/2) and Y=(j-(Ny+1)/2)/(Ny/2). The sample centers lie within [-1, 1], with each coordinate increasing along its corresponding array axis. The first two axes use column-major logical order; no pupil support mask is applied to the basis itself."

[[schemas]]
constant = "ANNULAR_PUPIL_SUPPORT_V1"
name = "annular-pupil-support"
element_type = "Bool"
version = 1
definition = "Boolean sampled annular pupil support in (pupil_x, pupil_y) axis order matching the first two normalized-pupil-xy axes, in column-major logical order. True marks the transmitting annulus and false marks the central obstruction or exterior. On the normalized cell-centered pupil grid, support includes samples satisfying obstruction_ratio^2 <= X^2 + Y^2 <= 1, with the producer declaring 0 <= obstruction_ratio < 1."

[[schemas]]
constant = "INFLUENCE_FUNCTIONS_V1"
name = "influence-functions"
element_type = "Float32"
version = 1
definition = "F32 deformable-mirror influence functions in (sampled pupil pixel, actuator) axis order, using column-major pupil pixel order and physical-actuator order."

