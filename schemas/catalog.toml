[[schemas]]
constant = "SHACK_HARTMANN_SUMMARY_V1"
name = "shack-hartmann-summary"
element_type = "Float32"
version = 1
channel_shape = [8]
channels = [
    {name = "subaperture_count", index = 0, title = "Subaperture count", units = "count"},
    {name = "valid_count", index = 1, title = "Valid count", units = "count"},
    {name = "mean_flux", index = 2, title = "Mean valid flux"},
    {name = "slope_rms_x", index = 3, title = "X slope RMS"},
    {name = "slope_rms_y", index = 4, title = "Y slope RMS"},
    {name = "slope_rms", index = 5, title = "Slope RMS"},
    {name = "mean_x_slope", index = 6, title = "Mean X slope"},
    {name = "mean_y_slope", index = 7, title = "Mean Y slope"},
]
definition = "Eight F32 diagnostics for one complete Shack-Hartmann frame in zero-based order: 0 total subaperture count, 1 valid count, 2 mean valid flux, 3 X slope RMS, 4 Y slope RMS, 5 hypot(X RMS, Y RMS), 6 mean X slope, 7 mean Y slope. Subaperture count is in 1:2^24 so both counts are exact Float32 integers. RMS is uncentered. Only validity-true rows contribute; accumulation uses Float64. Zero valid rows or any nonfinite flux or slope in a valid row yields NaN in fields 2 through 7 while counts retain their validity-derived values. Processing still succeeds. Flux and slopes retain their input units, including detector pixels for pixel-coordinate slopes; these are not calibrated physical tip, tilt, or focus estimates. Inputs belong to the same measurement frame and metadata follows slopes."

