# This file is the authoritative catalog of public scientific ndarray schemas.
# Run `julia scripts/generate_schemas.jl` after changing it.

catalog_version = 1
compatibility = "Schema identifiers are opaque. Ports are compatible only when their complete identifiers and structural ndarray formats match exactly."

[[schemas]]
constant = "BIQUAD_COEFFICIENTS_V1"
name = "biquad-coefficients"
element_type = "Float32"
version = 1
definition = "F32 dimensionless normalized temporal biquad coefficients in (coefficient, section, coefficient-set) order. Coefficient order is (b0, b1, b2, a1, a2), with a0 = 1 and denominator 1 + a1*z^-1 + a2*z^-2. Sections execute in ascending order. A single coefficient set is shared across modes; otherwise sets follow input-mode order. Every coefficient is finite and each section has poles strictly inside the unit circle."

