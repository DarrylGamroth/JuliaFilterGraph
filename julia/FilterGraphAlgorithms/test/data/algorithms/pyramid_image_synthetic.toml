# Generated snapshot from test/data/algorithms/pyramid_image_synthetic.toml.
# Regenerate with julia test/update_snapshots.jl test/data/algorithms/pyramid_image_synthetic.toml.
# Synthetic 2 × 2 pupils in a 4 × 4 detector. Arrays are column-major.
# Over supported coordinates, X = q1 + q4 - q2 - q3 and Y = q1 + q2 - q3 - q4.
# The mean divisor is the average four-pupil sum. Signal = gain * (difference / divisor - reference).

[geometry]
image_size = [4, 4]
pupil_size = [2, 2]
pupil_origins = [[0, 0], [2, 0], [2, 2], [0, 2]]
i4q_support = [true, false, true, true]

[calibration]
reference_signal = [0.125, 0.0625, -0.125, -0.125, 0.0625, -0.25]
optical_gain = [0.5, 1.5, 2.0, 0.25, 0.5, 1.25]

[frame]
image = [12, 4, 2, 9, 6, 7, 9, 15, 5, 15, 5, 18, 6, 15, 11, 3]

[mean_valid_flux]
normalization_policy = "mean-valid-flux"
divisor = 32.0
signal = [0.09375, -0.46875, 0.5, 0.0625, -0.0625, 0.46875]
reconstructor = [1, 0, -1, 0, 0, 0, 0, 1, 0, 0, 1, 0]
reconstructed = [-0.40625, -0.53125]

[incidence_flux]
normalization_policy = "incidence-flux"
divisor = 16.0
signal = [0.25, -0.84375, 0.75, 0.09375, -0.09375, 0.625]
