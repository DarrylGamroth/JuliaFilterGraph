# Minimal PipeWireAO core for a Julia Filter Graph island deployment.
#
# This file deliberately contains only the modules required to publish Nodes,
# Ports, Links, metadata, and native clients. Add camera, corrector, network, or
# monitoring modules in a site-owned deployment configuration after testing
# them with the exact native build used at that site.

context.properties = {
    # Publish a native socket for the island and its surrounding device Nodes.
    core.daemon = true
    core.name = pipewire-ao-0
    support.dbus = false

    # Resolve only the module and SPA directories selected by the service
    # environment. Silent fallback to an unrelated system PipeWire is unsafe.
    library.use-fallback = false
}

context.spa-libs = {
    support.* = support/libspa-support
}

context.modules = [
    # Add libpipewire-module-rt only in a site configuration that also supplies
    # and qualifies its scheduling support. This portable JLL profile makes no
    # real-time scheduling claim.
    { name = libpipewire-module-scheduler-v1 }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-link-factory }
    { name = libpipewire-module-metadata }
    { name = libpipewire-module-access }
]
