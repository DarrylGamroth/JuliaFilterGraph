# Generated snapshot from examples/pixel-pyramid-row/graph.conf.
# Regenerate with julia test/update_snapshots.jl examples/pixel-pyramid-row/graph.conf.
# Progressive row-block example. The Graph receives four two-row samples for
# each eight-row detector frame. SampleMetadata identifies the row offset and
# terminal block; only the completed pyramid result is externally published.
filter.graph = {
    # Each entry instantiates an Algorithm. `type = ndarray` selects typed
    # array Ports, `name` is Graph-local, and `label` selects a declaration.
    nodes = [
        {
            # Calibrate each incoming UInt16 row block to Float32.
            type = ndarray
            name = calibrate
            label = pixel-calibration-row-u16-f32
            config = {
                # Shape of the complete detector frame represented by blocks.
                image_size = [8, 8]
                # Rows carried by each input sample. It must be smaller than
                # and divide `image_size[1]`; here four blocks complete a frame.
                row_block_rows = 2
                # Optional row-major full-frame calibration planes. `null`
                # prepares identity flat and zero background values until the
                # Parameter Ports supply qualified arrays.
                initial_flat = null
                initial_background = null
            }
        }
        {
            # Accumulate calibrated row blocks and publish pyramid pixels when
            # the terminal block completes the logical detector frame.
            type = ndarray
            name = pyramid
            label = pyramid-pixel-row-f32
            config = {
                # Complete detector shape and incoming row-block height; these
                # must match the calibration Node above.
                image_size = [8, 8]
                row_block_rows = 2
                # Rectangular shape of each of the four pupil regions.
                pupil_size = [2, 2]
                # Four zero-based (row, column) origins in the established FGN
                # pupil order. Origins may later be replaced through a
                # Parameter Port without changing Port shapes.
                pupil_origins = [ [6 0] [0 0] [6 4] [0 4] ]
                # Row-major mask shared by all four pupils. Three `true`
                # values produce a reconstruction-pixels shape of 4 by 3;
                # replacement masks must retain that selected-pixel count.
                pupil_mask = [ true false true true ]
            }
        }
    ]
    # Stream each calibrated block directly into the pyramid accumulator.
    links = [
        { output = "calibrate:calibrated" input = "pyramid:row-block" }
    ]
    # External data and Parameter Ports exposed by the Julia island.
    inputs = [
        # UInt16 block, shape 2 by 8, with row-offset SampleMetadata.
        "calibrate:raw"
        # Float32 full-frame flat and background planes, each 8 by 8.
        "calibrate:flat"
        "calibrate:background"
        # Four zero-based pupil origins, shape 4 by 2.
        "pyramid:pupil-origins"
        # Boolean pupil mask, shape 2 by 2 with exactly three selections.
        "pyramid:pupil-mask"
    ]
    # Conditional outputs: unavailable for intermediate blocks and published
    # together only when a terminal block completes successfully.
    outputs = [
        # Four selected-pupil vectors, shape 4 by 3.
        "pyramid:reconstruction-pixels"
        # Scalar mean intensity over all four complete pupil regions.
        "pyramid:mean-pupil-intensity"
    ]
}
