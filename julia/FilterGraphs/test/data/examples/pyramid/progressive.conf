# Generated snapshot from examples/pyramid/progressive.conf.
# Regenerate with julia test/update_snapshots.jl examples/pyramid/progressive.conf.
{
    # Progressive pyramid-WFS normalization and dense reconstruction. The host
    # supplies calibrated detector row blocks. Newly complete selected pixels
    # begin their MVM work immediately; the Graph publishes only one terminal
    # reconstructed vector.
    node.name = example-pyramid-progressive-reconstruction

    filter.graph = {
        # Deployment scheduling for prepare_cpu_progressive_graph. Zero keeps
        # the no-extra-thread path. A deployment with reserved Julia threads
        # may set row_workers = 4 and worker_thread_ids = [3 4 5 6].
        execution = { cpu = { row_workers = 0 } }
        nodes = [
            {
                # Select and normalize newly available four-pupil pixels.
                type = ndarray
                name = measure
                label = pyramid-measurement-block-f32
                config = {
                    # Full calibrated detector height and width in pixels.
                    image_size = [64, 64]
                    # Two detector rows per callback gives 32 blocks per
                    # logical detector sample.
                    row_block_rows = 2
                    # Shape of each rectangular pupil region.
                    pupil_size = [30, 30]
                    # Four zero-based (row, column) pupil origins in the
                    # established pupil identity order.
                    pupil_origins = [ [34 0] [0 0] [34 34] [0 34] ]
                    # `null` selects every pixel in the 30 by 30 pupil. A
                    # same-count qualified mask can replace this Parameter.
                    pupil_mask = null
                    # Graph-local aligned-block schemas. Producer and consumer
                    # values must match exactly.
                    measurements_schema = org.example.ao.pwfs-measurement-block/1
                    column_indices_schema = org.example.ao.reconstructor-column-indices/1
                    measurement_count_schema = org.example.ao.measurement-block-count/1
                }
            }
            {
                # Accumulate the MVM columns identified by the measurement
                # producer, independent of detector pupil availability order.
                type = ndarray
                name = reconstruct
                label = incremental-dense-reconstructor-f32
                config = {
                    # Four pupils times 900 selected pixels.
                    measurement_count = 3600
                    # Fixed block storage; count selects the valid prefix.
                    measurement_block_capacity = 3600
                    # Must equal image_size[1] / row_block_rows above.
                    blocks_per_sample = 32
                    # Number of reconstructed controller coordinates.
                    reconstructed_count = 221
                    # `null` prepares a zero matrix until the qualified
                    # reconstructor Parameter is supplied.
                    initial_reconstructor = null
                    # Must match the three producer schemas exactly.
                    measurements_schema = org.example.ao.pwfs-measurement-block/1
                    column_indices_schema = org.example.ao.reconstructor-column-indices/1
                    measurement_count_schema = org.example.ao.measurement-block-count/1
                    # Established FGN compatibility schemas for the prepared
                    # reconstructor and terminal residual error.
                    reconstructed_schema = pipewireao/controller-residual-error-f32/1
                    reconstructor_schema = pipewireao/pwfs-reconstructor-f32/1
                }
            }
        ]
        links = [
            { output = "measure:measurements" input = "reconstruct:measurements" }
            { output = "measure:columns" input = "reconstruct:columns" }
            { output = "measure:count" input = "reconstruct:count" }
        ]
        inputs = [
            # Calibrated Float32 row block, shape 2 by 64.
            "measure:row-block"
            # Qualified pupil registration, mask, and dense reconstructor.
            "measure:pupil-origins"
            "measure:pupil-mask"
            "reconstruct:reconstructor"
        ]
        outputs = [
            # Published once after all 3600 columns and every downstream Node
            # have completed successfully.
            "reconstruct:reconstructed"
        ]
    }
}
