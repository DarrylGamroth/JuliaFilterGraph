# Generated snapshot from examples/leaky-controller/graph.conf.
# Regenerate with julia test/update_snapshots.jl examples/leaky-controller/graph.conf.
{
    # PipeWire name of the Julia island Node that hosts this Filter Graph.
    node.name = julia-leaky-controller

    # `nodes` instantiate Algorithms, `links` connect typed Ports, and
    # `inputs`/`outputs` expose the Graph boundary.
    filter.graph = {
        nodes = [
            {
                # Stateful controller recurrence in controller coordinates.
                # `type = ndarray` selects array Ports, `name` is Graph-local,
                # and `label` selects the registered Algorithm declaration.
                type = ndarray
                name = law
                label = leaky-integrator-f32
                config = {
                    # Input, output, and committed-state vector length.
                    extent = 3
                    # Reset value for every committed controller coordinate.
                    initial_state = 0.0
                    # Compatibility schemas that define the scientific meaning
                    # of the input and output vectors.
                    input_schema = pipewireao/controller-residual-error-f32/1
                    output_schema = pipewireao/controller-command-f32/1
                }
                props = {
                    # With reconstruction in the preceding Node, this is the
                    # pyRTC standard-integrator recurrence. Its correction
                    # convention gives the residual-error term a negative gain.
                    # Current residual-error multiplier.
                    gain = -0.4
                    # Previous committed-command multiplier; one is a pure
                    # integrator and values below one introduce leakage.
                    pole = 1.0
                }
            }
            {
                # Project the three controller coordinates into two active
                # virtual-DM (VDM) coordinates.
                type = ndarray
                name = project
                label = controller-to-vdm-f32
                config = {
                    # Input controller vector length.
                    controller_command_count = 3
                    # Output active-VDM vector length.
                    active_vdm_count = 2
                }
            }
            {
                # Expand active VDM coordinates to the full virtual grid, then
                # project the full grid onto physical-DM (PDM) actuators.
                type = ndarray
                name = pdm-project
                label = vdm-to-pdm-f32
                config = {
                    # Controlled VDM-coordinate count.
                    active_vdm_count = 2
                    # Full virtual-grid coordinate count used for extrapolation.
                    full_vdm_count = 3
                    # Physical actuator count at the requested-command output.
                    physical_actuator_count = 2
                }
            }
            {
                # Apply physical range and slew constraints to the request.
                type = ndarray
                name = condition
                label = pdm-command-f32
                config = {
                    # Requested, demanded, and feedback vector length.
                    actuator_count = 2
                    # Inclusive normalized actuator bounds. Scalars apply to
                    # all actuators; vectors can define per-actuator limits.
                    command_limits = [-0.8, 0.8]
                    # Maximum absolute actuator change per successful sample.
                    slew_limit = 0.5
                    # `independent` limits actuators separately;
                    # Initial committed actuator commands used by slew limiting
                    # after preparation and reset.
                    initial_current = [ 0.0 0.0 ]
                }
            }
            {
                # Project physical command correction back to active VDM space.
                type = ndarray
                name = feedback-to-vdm
                label = pdm-feedback-to-vdm-f32
                config = {
                    # Dimensions mirror the forward `pdm-project` Node.
                    active_vdm_count = 2
                    full_vdm_count = 3
                    physical_actuator_count = 2
                }
            }
            {
                # Return active-VDM correction to controller coordinates.
                type = ndarray
                name = feedback-to-controller
                label = vdm-feedback-to-controller-f32
                config = {
                    # Output controller count and input active-VDM count.
                    controller_command_count = 3
                    active_vdm_count = 2
                }
            }
        ]
        # Internal Port connections use `node-name:port-name`. Linked element
        # types, shapes, and schemas must agree.
        links = [
            # Controller law output into the controller-to-VDM projection.
            { output = "law:output" input = "project:controller-command" }
            {
                # Active VDM command into extrapolation/PDM projection.
                output = "project:vdm-command"
                input = "pdm-project:vdm-command"
            }
            {
                # Requested physical command into constraint conditioning.
                output = "pdm-project:requested-pdm-command"
                input = "condition:requested"
            }
            {
                # Physical constraint correction into reverse PDM projection.
                output = "condition:constraint-feedback"
                input = "feedback-to-vdm:pdm-constraint-feedback"
            }
            {
                # Active-VDM correction into the controller projection.
                output = "feedback-to-vdm:vdm-constraint-feedback"
                input = "feedback-to-controller:vdm-constraint-feedback"
            }
        ]
        # External data and Parameter Ports. Projection matrices are supplied
        # outside the configuration so deployments can adopt qualified arrays.
        inputs = [
            # Per-sample controller residual-error vector, length 3.
            "law:input"
            # Controller-to-active-VDM projection, shape 2 by 3.
            "project:controller-to-vdm"
            # Active-to-full VDM extrapolation, shape 3 by 2.
            "pdm-project:active-to-full"
            # Full-VDM-to-PDM projection, shape 2 by 3.
            "pdm-project:vdm-to-pdm"
            # Full-to-active VDM feedback projection, shape 2 by 3.
            "feedback-to-vdm:full-to-active"
            # PDM-to-full-VDM feedback projection, shape 3 by 2.
            "feedback-to-vdm:pdm-to-vdm"
            # Active-VDM-to-controller projection, shape 3 by 2.
            "feedback-to-controller:vdm-to-controller"
        ]
        # External outputs publish only after successful Graph completion;
        # Node state uses each Algorithm's local commit/discard contract.
        outputs = [
            # Conditioned physical actuator command, length 2.
            "condition:demanded"
            # Constraint correction in controller coordinates, length 3.
            # The external owner receives it; this leaky-integrator Node
            # does not adopt constraint feedback in its recurrence.
            "feedback-to-controller:controller-constraint-feedback"
        ]
    }
}
