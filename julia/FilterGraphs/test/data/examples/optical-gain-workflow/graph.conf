# Generated snapshot from examples/optical-gain-workflow/graph.conf.
# Regenerate with julia test/update_snapshots.jl examples/optical-gain-workflow/graph.conf.
# Composed optical-gain workflow. The source emits modal dithers, the estimator
# demodulates one complete window, the update Node admits bounded estimates,
# and the correction Node applies the currently adopted physical gains.
filter.graph = {
    # Each entry instantiates an Algorithm. `type = ndarray` selects typed
    # array Ports, `name` is Graph-local, and `label` selects a declaration.
    nodes = [
        {
            # Generate synchronized modal sinusoidal probe commands.
            type = ndarray
            name = dither
            label = optical-gain-dither-f32
            config = {
                # One descriptor per dither mode. All descriptors must produce
                # the same estimate-window length:
                # `frames_per_period * periods_per_estimate`.
                modes = [
                    {
                        # Positive commanded modal amplitude.
                        amplitude = 0.5
                        # Samples in one sinusoidal period; minimum is four.
                        frames_per_period = 4
                        # Complete periods accumulated into each estimate.
                        periods_per_estimate = 1
                    }
                ]
            }
        }
        {
            # Demodulate realized command and reconstructed response modes over
            # the synchronized dither window.
            type = ndarray
            name = estimate
            label = optical-gain-estimator-f32
            config = {
                # Must exactly match the source schedule so phase indices and
                # estimate-window boundaries have the same interpretation.
                modes = [
                    {
                        # Expected commanded amplitude for this dither mode.
                        amplitude = 0.5
                        # Samples in one sinusoidal period.
                        frames_per_period = 4
                        # Periods accumulated before an estimate is complete.
                        periods_per_estimate = 1
                    }
                ]
                # Prepared calibration response amplitude per dither mode.
                # Values may later be replaced through the estimator's
                # `calibration-responses` Parameter Port.
                initial_calibration_responses = [ 1.0 ]
            }
        }
        {
            # Accept qualified estimates and filter them into physical gains.
            type = ndarray
            name = update
            label = optical-gain-update-f32
            config = {
                # Inclusive acceptance criteria, one entry per dither mode.
                criteria = [
                    {
                        # Reject estimates with a smaller realized command.
                        minimum_command_amplitude = 0.1
                        # Reject estimates with a smaller measured response.
                        minimum_response_amplitude = 0.05
                        # Smallest accepted positive physical optical gain.
                        minimum_optical_gain = 0.2
                        # Largest accepted physical optical gain.
                        maximum_optical_gain = 1.0
                        # Largest accepted absolute command/response phase lag,
                        # in radians and restricted to the interval [0, pi].
                        maximum_absolute_phase_lag = 0.25
                    }
                ]
                # One entry per reconstructed mode. `dither-mode` filters an
                # accepted estimate; `hold` would retain the committed gain.
                assignments = [
                    {
                        # Assignment variant defined by the FGN contract.
                        kind = dither-mode
                        # Zero-based index into the criteria/dither-mode list.
                        dither_mode = 0
                        # Fraction of each accepted estimate adopted per update;
                        # 1 uses it immediately and smaller values smooth it.
                        update_fraction = 0.5
                    }
                ]
                # Initial committed physical gain per reconstructed mode.
                initial_optical_gains = [ 1.0 ]
            }
        }
        {
            # Divide reconstructed modes by prepared physical optical gains.
            type = ndarray
            name = correct
            label = optical-gain-correction-f32
            config = {
                # Initial positive physical gain per reconstructed mode. The
                # `correct:optical-gains` Parameter Port adopts later updates.
                optical_gains = [ 1.0 ]
            }
        }
    ]
    # Internal connections use `node-name:port-name`; linked element types,
    # shapes, schemas, and rates must agree.
    links = [
        {
            # Commanded dither is the realized command in this minimal example;
            # a real RTC may route this through command projection/conditioning.
            output = "dither:commanded-modes"
            input = "estimate:realized-command-modes"
        }
        {
            # Current zero-based sample index within the estimate window.
            output = "dither:window-frame"
            input = "estimate:window-frame"
        }
        {
            # Current phase-table index for every dither mode.
            output = "dither:phase-indices"
            input = "estimate:phase-indices"
        }
        {
            # Marks the sample that closes the current estimate window.
            output = "dither:completes-window"
            input = "estimate:completes-window"
        }
        {
            # Demodulated realized command amplitudes into acceptance checks.
            output = "estimate:command-amplitudes"
            input = "update:command-amplitudes"
        }
        {
            # Demodulated response amplitudes into acceptance checks.
            output = "estimate:response-amplitudes"
            input = "update:response-amplitudes"
        }
        {
            # Estimated gains into bounded physical-gain adoption.
            output = "estimate:optical-gains"
            input = "update:optical-gain-estimates"
        }
        {
            # Measured phase lags into acceptance checks.
            output = "estimate:phase-lags"
            input = "update:phase-lags"
        }
        # Per-dither numerical validity into acceptance checks.
        { output = "estimate:valid" input = "update:valid" }
        {
            # Window-completion signal triggers an update decision.
            output = "estimate:estimate-complete"
            input = "update:estimate-complete"
        }
    ]
    # External data and Parameter Ports exposed by the Julia island.
    inputs = [
        # Per-sample reconstructed modal response to the applied dither.
        "estimate:reconstructed-response-modes"
        # Per-sample reconstructed modes to correct with adopted gains.
        "correct:reconstructed"
        # Replaceable calibration response per dither mode.
        "estimate:calibration-responses"
        # Replaceable physical gain per corrected reconstructed mode. A host
        # may adopt the update output here at a later Graph boundary.
        "correct:optical-gains"
    ]
    # External outputs published according to each Port's availability.
    outputs = [
        # Modal dither command to add to the RTC command path.
        "dither:commanded-modes"
        # Scalar signal identifying a newly completed estimate window.
        "estimate:estimate-complete"
        # Current committed physical gains from bounded adoption.
        "update:optical-gains"
        # Per-dither result of the acceptance criteria.
        "update:accepted-dither-modes"
        # Per-reconstructed-mode signal identifying an adopted update.
        "update:updated-reconstructed-modes"
        # Reconstructed modes divided by currently prepared physical gains.
        "correct:corrected"
    ]
}
